spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kumo_db}
    username: ${SPRING_DATASOURCE_USERNAME:kumo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:kumo_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

kumo:
  mail:
    from: ${MAIL_FROM:hello@kumohost.co.za}
  cors:
    allowed-origins: ${KUMO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://kumohost.co.za}

logging:
  level:
    root: INFO
    com.kumo: DEBUG
    org.springframework.security: DEBUG
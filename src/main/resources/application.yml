spring:
  application:
    name: kumo-backend
  profiles:
    active: dev

server:
  port: 8080

kumo:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  verification:
    provider-api-key: ${VERIFICATION_PROVIDER_KEY}
    webhook-secret: ${VERIFICATION_WEBHOOK_SECRET}
